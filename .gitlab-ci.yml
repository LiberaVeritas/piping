stages:
  - lint
  - build

lint:
  stage: lint
  tags: 
    - dockter
  rules:
    - changes:
      - ./cmd
      - ./internal
  image: golangci/golangci-lint:v2.12.2-alpine
  script:
    - export GOEXPERIMENT=jsonv2
    - go mod tidy
    - golangci-lint fmt ./...
    - golangci-lint run ./...
    - go test ./... -race

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
      - ./cmd
      - ./internal
  tags:
    - docker-build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_REGISTRY_USER --password-stdin
    - docker build -t "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}" -f Containerfile .
    - docker push --platform=linux/amd64 "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}"
