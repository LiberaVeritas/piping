stages:
  - lint
  - test
  - build

variables:
  GOEXPERIMENT: "jsonv2"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  before_script:
    - git remote add ci_origin "https://oauth2:${CI_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.name "GitLab CI Bot"
    - git config user.email "ci-bot@noreply.${CI_SERVER_HOST}" 
  script:
    - go mod tidy
    - golangci-lint fmt ./...
  
    - TARGET_BRANCH=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}
    - git add . && git diff-index --quiet HEAD || (git commit -m "auto-format & go mod tidy [skip ci]"
    - git push ci_origin HEAD:"${TARGET_BRANCH}" -o ci.skip

    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  script:
    - go test ./... -race

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - docker-build
  script:
    - export PIPING_BUILD=$CI_PIPELINE_IID
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_REGISTRY_USER --password-stdin
    - docker build --platform=linux/amd64 -t "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}" -f Containerfile .
    - docker push "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}"