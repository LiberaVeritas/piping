stages:
  - lint
  - test
  - build

variables:
  GOEXPERIMENT: "jsonv2"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2-alpine
  variables:
    GIT_AUTHOR_NAME: "$GITLAB_USER_NAME (via pipeline)"
    GIT_AUTHOR_EMAIL: $GITLAB_USER_EMAIL
    GIT_COMMITTER_NAME: "$GITLAB_USER_NAME (via pipeline)"
    GIT_COMMITTER_EMAIL: $GITLAB_USER_EMAIL
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  before_script:
    - apk add --no-cache git 
    - git remote add ci_origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" || echo
    - git remote set-url --push ci_origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - TARGET_BRANCH=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}
  script:
    - go mod tidy
    - golangci-lint fmt ./...
  
    - git add . && git diff-index --quiet HEAD || git commit -m "auto-format & go mod tidy [skip ci]"
    - git push ci_origin HEAD:"${TARGET_BRANCH}" -o ci.skip

    - golangci-lint run ./...
  artifacts:
    paths:
      - go.mod
      - go.sum

test:
  stage: test
  image: golang:1.26
  services:
    - postgres:18-alpine
  variables:
    POSTGRES_USER: "piping"
    POSTGRES_PASSWORD: "piping"
    POSTGRES_DB: "piping_test"
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: "postgres://piping:piping@postgres:5432/piping_test"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  dependencies: ["lint"]
  script:
    - go test ./... -race

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - docker-build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_REGISTRY_USER --password-stdin
    - docker build -t "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}" --build-arg PIPING_BUILD=$CI_PIPELINE_IID -f Containerfile .
    - docker push --platform=linux/amd64 "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}"