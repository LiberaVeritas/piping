stages:
  - lint
  - test
  - build

variables:
  GOEXPERIMENT: "jsonv2"
  GIT_AUTHOR_NAME: "GitLab CI Bot"
  GIT_AUTHOR_EMAIL: "ci-bot@noreply.${CI_SERVER_HOST}"
  GIT_COMMITTER_NAME: "GitLab CI Bot"
  GIT_COMMITTER_EMAIL: "ci-bot@noreply.${CI_SERVER_HOST}"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - dockter
  script:
    - go test ./... -race

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - cmd/**/*
        - internal/**/*
  tags:
    - docker-build
  script:
    - export PIPING_BUILD=$CI_PIPELINE_IID
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_REGISTRY_USER --password-stdin
    - docker build --platform=linux/amd64 -t "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}" -f Containerfile .
    - docker push "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}"